[workspace]
resolver = "2"
members = ["crates/phpide-core", "crates/phpide-editor", "crates/phpide-db", "crates/phpide-dbgp", "crates/phpide-exec", "crates/phpide-php", "crates/phpide-lsp", "crates/phpide-run", "crates/phpide-syntax", "crates/phpide-icons", "crates/phpide-ui", "crates/phpide-vcs"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tavaresgerson/php-ide.git"

[profile.release]
opt-level = 2
