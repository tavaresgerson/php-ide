[workspace]
resolver = "2"
members = ["crates/phpide-core", "crates/phpide-dbgp", "crates/phpide-exec", "crates/phpide-php", "crates/phpide-lsp", "crates/phpide-run", "crates/phpide-syntax", "crates/phpide-ui"]

[workspace.package]
