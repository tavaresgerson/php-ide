[package]
name = "phpide-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Interface gráfica (egui/eframe) do phpide"

[dependencies]
eframe = "0.36"
notify = "7"
serde_json = "1"
libc = "0.2"
phpide-core = { path = "../phpide-core" }
phpide-db = { path = "../phpide-db" }
phpide-dbgp = { path = "../phpide-dbgp" }
phpide-exec = { path = "../phpide-exec" }
phpide-lsp = { path = "../phpide-lsp" }
phpide-run = { path = "../phpide-run" }
phpide-vcs = { path = "../phpide-vcs" }
phpide-icons = { path = "../phpide-icons" }
phpide-php = { path = "../phpide-php" }
phpide-syntax = { path = "../phpide-syntax" }

[features]
# Features frozen until v1.0 (Database Tools, frontend language servers,
# Services, Remote Host, Deployment, Plugins/Learn/Remote Development pages).
# The code stays compiled and tested in CI with `--features experimental`,
# but is hidden from the default build.
experimental = []

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.36", features = ["eframe"] }
png = "0.18"

[[bench]]
name = "search_large"
harness = false

[[bench]]
name = "viewport"
harness = false

[[bench]]
name = "editor_pipeline"
harness = false
