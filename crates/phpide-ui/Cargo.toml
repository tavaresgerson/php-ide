[package]
name = "phpide-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Interface gráfica (egui/eframe) do phpide"

[dependencies]
eframe = "0.31"
notify = "7"
serde_json = "1"
libc = "0.2"
phpide-core = { path = "../phpide-core" }
phpide-dbgp = { path = "../phpide-dbgp" }
phpide-exec = { path = "../phpide-exec" }
phpide-lsp = { path = "../phpide-lsp" }
phpide-run = { path = "../phpide-run" }
phpide-vcs = { path = "../phpide-vcs" }
phpide-php = { path = "../phpide-php" }
phpide-syntax = { path = "../phpide-syntax" }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "search_large"
harness = false

[[bench]]
name = "viewport"
harness = false
