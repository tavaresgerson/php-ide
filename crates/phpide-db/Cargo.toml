[package]
name = "phpide-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Database Tools: contratos de drivers, segredos, data sources, introspection, console, grade e edição transacional (DB-001..006, NFR-004-03/04/05)"

[dependencies]
phpide-core = { path = "../phpide-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19.14", features = ["with-time-0_3", "with-uuid-1"] }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust"] }
mysql_common = "0.37.3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
