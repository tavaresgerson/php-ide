[package]
name = "phpide-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Database Tools: contratos de drivers, segredos, data sources, introspection, console, grade e edição transacional (DB-001..006, NFR-004-03/04/05)"

[dependencies]
phpide-core = { path = "../phpide-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
