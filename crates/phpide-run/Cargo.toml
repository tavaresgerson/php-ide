[package]
name = "phpide-run"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Run configurations versionadas, sessões de execução, PHPUnit e cobertura (RUN-001/002, RUN-TST)"

[dependencies]
phpide-core = { path = "../phpide-core" }
phpide-exec = { path = "../phpide-exec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
phpide-dbgp = { path = "../phpide-dbgp" }
tempfile = "3"
